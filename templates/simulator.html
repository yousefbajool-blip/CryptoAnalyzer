<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 شبیه‌ساز معاملاتی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;padding:15px;color:#fff}.container{max-width:1000px;margin:0 auto}.header{text-align:center;padding:20px 0;background:rgba(255,255,255,0.05);border-radius:20px;margin-bottom:20px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1)}.header h1{font-size:2em;background:linear-gradient(135deg,#00b894,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.header p{color:rgba(255,255,255,0.6);font-size:.9em;margin-top:5px}.nav-bar{display:flex;justify-content:center;gap:15px;margin-bottom:20px}.nav-btn{padding:8px 25px;border:2px solid rgba(255,255,255,0.2);border-radius:50px;background:transparent;color:#fff;font-size:.9em;cursor:pointer;transition:all .3s ease;text-decoration:none}.nav-btn:hover,.nav-btn.active{background:rgba(0,184,148,0.2);border-color:#00b894}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat-card{background:rgba(255,255,255,0.05);border-radius:12px;padding:12px 15px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);text-align:center}.stat-card .label{font-size:.65em;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px}.stat-card .value{font-size:1.4em;font-weight:700;margin-top:3px}.stat-card .value.positive{color:#00b894}.stat-card .value.negative{color:#e17055}.trade-form{background:rgba(255,255,255,0.05);border-radius:12px;padding:15px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.08)}.trade-form h3{margin-bottom:12px;color:rgba(255,255,255,0.8);font-size:1em}.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}.form-group{display:flex;flex-direction:column;gap:4px}.form-group label{font-size:.65em;color:rgba(255,255,255,0.5);text-transform:uppercase}.form-group input,.form-group select{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;font-size:13px;outline:none}.form-group input:focus,.form-group select:focus{border-color:#00b894}.form-group input::placeholder{color:rgba(255,255,255,0.3)}.form-group select option{background:#1a1a2e;color:#fff}.btn{padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .3s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}.btn-buy{background:linear-gradient(135deg,#00b894,#00a381);color:#fff}.btn-danger{background:linear-gradient(135deg,#e17055,#d63031);color:#fff}.btn-secondary{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15)}.btn-sm{padding:4px 10px;font-size:11px}.trades-table{background:rgba(255,255,255,0.03);border-radius:12px;overflow-x:auto;border:1px solid rgba(255,255,255,0.05)}.trades-table table{width:100%;border-collapse:collapse;font-size:.85em;min-width:500px}.trades-table th{padding:10px 12px;text-align:right;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);font-size:.65em;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}.trades-table td{padding:8px 12px;border-top:1px solid rgba(255,255,255,0.05);white-space:nowrap}.trades-table .profit{color:#00b894;font-weight:600}.trades-table .loss{color:#e17055;font-weight:600}.empty-state{text-align:center;padding:30px;color:rgba(255,255,255,0.3)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap}
        @media(max-width:992px){.stats-grid{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr 1fr}}
        @media(max-width:600px){.stats-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.header h1{font-size:1.5em}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 شبیه‌ساز معاملاتی</h1>
            <p>ثبت خرید و فروش با محاسبه خودکار سود/ضرر</p>
        </div>
        <div class="nav-bar">
            <a href="/" class="nav-btn">📊 تحلیل</a>
            <a href="/simulator" class="nav-btn active">🎮 شبیه‌ساز</a>
        </div>
        
        <div class="stats-grid" id="stats">
            <div class="stat-card"><div class="label">💰 سرمایه درگیر</div><div class="value" id="totalCapital">$0</div></div>
            <div class="stat-card"><div class="label">📈 سود/ضرر کل</div><div class="value" id="totalProfit">$0</div></div>
            <div class="stat-card"><div class="label">✅ تعداد معاملات</div><div class="value" id="totalTrades">0</div></div>
            <div class="stat-card"><div class="label">🎯 نرخ موفقیت</div><div class="value" id="winRate">0%</div></div>
        </div>
        
        <div class="trade-form">
            <h3>📝 ثبت معامله جدید</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>رمزارز</label>
                    <select id="tradeCrypto">
                        <option value="بیت‌کوین">بیت‌کوین</option>
                        <option value="اتریوم">اتریوم</option>
                        <option value="سولانا">سولانا</option>
                        <option value="ریپل">ریپل</option>
                        <option value="کاردانو">کاردانو</option>
                        <option value="بایننس کوین">بایننس کوین</option>
                        <option value="داوج کوین">داوج کوین</option>
                        <option value="پولکادات">پولکادات</option>
                        <option value="آوالانچ">آوالانچ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نوع معامله</label>
                    <select id="tradeType">
                        <option value="buy">🟢 خرید</option>
                        <option value="sell">🔴 فروش</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تعداد</label>
                    <input type="number" id="tradeAmount" placeholder="مثلاً 1" step="0.01" min="0.01">
                </div>
                <div class="form-group">
                    <label>قیمت (دلار)</label>
                    <input type="number" id="tradePrice" placeholder="مثلاً 1000" step="0.01">
                </div>
                <div class="form-group">
                    <button class="btn btn-buy" id="executeBtn" onclick="executeTrade()">
                        <i class="fas fa-check"></i> ثبت معامله
                    </button>
                </div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn btn-danger btn-sm" onclick="clearTrades()"><i class="fas fa-trash"></i> پاک کردن همه</button>
            <button class="btn btn-secondary btn-sm" onclick="loadTrades()"><i class="fas fa-sync-alt"></i> بروزرسانی</button>
        </div>
        
        <div class="trades-table" id="tradesContainer">
            <div class="empty-state"><i class="fas fa-inbox" style="font-size:2em;display:block;margin-bottom:10px;"></i>هیچ معامله‌ای ثبت نشده است</div>
        </div>
    </div>
    
    <script>
        let trades = [];
        
        async function loadTrades() {
            try {
                const response = await fetch('/api/trades');
                if (response.ok) {
                    trades = await response.json();
                    renderTrades();
                    updateStats();
                }
            } catch (e) {
                console.log('خطا در بارگذاری معاملات:', e);
            }
        }
        
        async function executeTrade() {
            const cryptoSelect = document.getElementById('tradeCrypto');
            const typeSelect = document.getElementById('tradeType');
            const amountInput = document.getElementById('tradeAmount');
            const priceInput = document.getElementById('tradePrice');
            
            const crypto = cryptoSelect.value;
            const type = typeSelect.value;
            const amount = parseFloat(amountInput.value);
            const price = parseFloat(priceInput.value);
            
            if (!amount || amount <= 0) {
                alert('❌ لطفاً تعداد معتبر وارد کنید');
                return;
            }
            
            if (!price || price <= 0) {
                alert('❌ لطفاً قیمت معتبر وارد کنید');
                return;
            }
            
            const trade = {
                crypto: crypto,
                type: type,
                amount: amount,
                price: price,
                total: amount * price,
                status: 'closed',
                date: new Date().toISOString(),
                buy_price: price,
                close_price: price,
                profit: 0
            };
            
            try {
                const response = await fetch('/api/trades', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(trade)
                });
                
                if (response.ok) {
                    amountInput.value = '';
                    priceInput.value = '';
                    await loadTrades();
                }
            } catch (e) {
                console.log('خطا در ثبت معامله:', e);
                alert('❌ خطا در ثبت معامله');
            }
        }
        
        async function clearTrades() {
            if (!confirm('آیا مطمئن هستید؟ همه معاملات پاک می‌شوند.')) return;
            try {
                await fetch('/api/trades', { method: 'DELETE' });
                await loadTrades();
            } catch (e) {
                console.log('خطا در پاک کردن:', e);
            }
        }
        
        function renderTrades() {
            const container = document.getElementById('tradesContainer');
            
            if (!trades || trades.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox" style="font-size:2em;display:block;margin-bottom:10px;"></i>هیچ معامله‌ای ثبت نشده است</div>`;
                return;
            }
            
            const sorted = [...trades].reverse();
            let html = `<table><thead><tr>
                <th>رمزارز</th><th>نوع</th><th>تعداد</th><th>قیمت</th>
                <th>سود/ضرر</th><th>تاریخ</th>
            </tr></thead><tbody>`;
            
            for (const trade of sorted) {
                const isBuy = trade.type === 'buy';
                
                html += `<tr>
                    <td><strong>${trade.crypto}</strong></td>
                    <td style="color:${isBuy ? '#00b894' : '#e17055'}">${isBuy ? '🟢 خرید' : '🔴 فروش'}</td>
                    <td>${trade.amount}</td>
                    <td>$${trade.price.toFixed(2)}</td>
                    <td>-</td>
                    <td><span style="font-size:.65em;color:rgba(255,255,255,0.3);">${new Date(trade.date).toLocaleDateString('fa-IR')}</span></td>
                </tr>`;
            }
            
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
        
        function updateStats() {
            let totalCapital = 0;
            let totalTrades = 0;
            
            for (const trade of trades) {
                totalTrades++;
                totalCapital += trade.total || 0;
            }
            
            document.getElementById('totalCapital').textContent = '$' + totalCapital.toFixed(2);
            document.getElementById('totalProfit').textContent = '$0.00';
            document.getElementById('totalTrades').textContent = totalTrades;
            document.getElementById('winRate').textContent = '0%';
        }
        
        window.onload = async function() {
            await loadTrades();
        };
    </script>
</body>
</html>
