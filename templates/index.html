<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 تحلیل‌گر هوشمند رمزارزها</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;padding:20px;color:#fff}.container{max-width:1400px;margin:0 auto}.header{text-align:center;padding:25px 0;background:rgba(255,255,255,0.05);border-radius:20px;margin-bottom:25px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1)}.header h1{font-size:2.2em;background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.header p{color:rgba(255,255,255,0.6);font-size:1em;margin-top:8px}.header .subtitle{color:rgba(255,255,255,0.35);font-size:.85em}.nav-bar{display:flex;justify-content:center;gap:20px;margin-bottom:25px}.nav-btn{padding:10px 30px;border:2px solid rgba(255,255,255,0.2);border-radius:50px;background:transparent;color:#fff;font-size:1em;cursor:pointer;transition:all .3s ease;text-decoration:none}.nav-btn:hover,.nav-btn.active{background:rgba(247,151,30,0.2);border-color:#f7971e}.controls{display:flex;justify-content:center;align-items:center;gap:15px;margin-bottom:25px;flex-wrap:wrap}.btn{padding:10px 25px;border:none;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s ease;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15)}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}.btn-primary{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;border:none}.btn-primary:hover{transform:translateY(-2px) scale(1.02)}.btn-primary:disabled{opacity:.6;cursor:not-allowed}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filters input,.filters select{padding:8px 15px;border-radius:25px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:13px;outline:none}.filters input::placeholder{color:rgba(255,255,255,0.4)}.filters select option{background:#1a1a2e;color:#fff}.asset-section{margin-bottom:35px;background:rgba(255,255,255,0.03);border-radius:15px;padding:15px;border:1px solid rgba(255,255,255,0.05)}.asset-title{font-size:1.4em;font-weight:700;margin-bottom:12px;padding:8px 15px;background:rgba(255,255,255,0.05);border-radius:12px;border-right:4px solid #f7971e;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;cursor:pointer}.asset-title .change{font-size:.7em}.asset-title .change.positive{color:#00b894}.asset-title .change.negative{color:#e17055}.timeframes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.timeframe-card{background:rgba(255,255,255,0.05);border-radius:12px;padding:12px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);transition:all .3s ease}.timeframe-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.2)}.timeframe-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.08)}.timeframe-label{font-size:.7em;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px}.timeframe-price{font-size:1.4em;font-weight:700}.badge{padding:2px 10px;border-radius:50px;font-size:.6em;font-weight:600}.badge-buy{background:#00b894;color:#fff}.badge-sell{background:#e17055;color:#fff}.badge-hold{background:#fdcb6e;color:#1a1a2e}.badge-score{background:rgba(255,255,255,0.1);color:#fff;font-size:.6em;padding:2px 8px;border-radius:10px}.suggestion-text{background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;margin:8px 0;font-size:.8em;color:rgba(255,255,255,0.8);border-right:3px solid #f7971e}.levels-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.level-item{background:rgba(255,255,255,0.05);border-radius:6px;padding:4px 6px;text-align:center}.level-item .label{font-size:.5em;color:rgba(255,255,255,0.35);text-transform:uppercase}.level-item .value{font-size:.75em;font-weight:600}.indicators-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.indicator-item{background:rgba(255,255,255,0.05);border-radius:6px;padding:4px 6px;text-align:center}.indicator-item .label{font-size:.45em;color:rgba(255,255,255,0.35);text-transform:uppercase}.indicator-item .value{font-size:.75em;font-weight:600}.value-buy{color:#00b894}.value-sell{color:#e17055}.value-neutral{color:#fdcb6e}.chart-container{margin-top:12px;background:rgba(255,255,255,0.03);border-radius:10px;padding:10px}.chart-container canvas{max-height:150px;width:100%!important}.chart-toggle{cursor:pointer;color:rgba(255,255,255,0.4);font-size:.8em;transition:all .3s ease}.chart-toggle:hover{color:#f7971e}.loading{text-align:center;padding:40px;font-size:1.1em;color:rgba(255,255,255,0.5)}.loading .spinner{animation:spin 1s linear infinite;font-size:2em;display:block;margin-bottom:15px}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}.footer{text-align:center;padding:20px 0;color:rgba(255,255,255,0.2);font-size:.8em;margin-top:20px}.simulator-link{display:inline-block;margin-left:15px;padding:8px 20px;background:rgba(0,184,148,0.2);border:1px solid #00b894;border-radius:30px;color:#00b894;text-decoration:none;font-size:.9em;transition:all .3s ease}.simulator-link:hover{background:#00b894;color:#1a1a2e}@media(max-width:992px){.timeframes-grid{grid-template-columns:1fr 1fr}.levels-grid{grid-template-columns:repeat(2,1fr)}.indicators-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.header h1{font-size:1.5em}.timeframes-grid{grid-template-columns:1fr}.levels-grid{grid-template-columns:1fr 1fr}.indicators-grid{grid-template-columns:1fr 1fr}.filters{flex-direction:column;width:100%}.filters input,.filters select{width:100%}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 تحلیل‌گر هوشمند رمزارزها</h1>
            <p>پایش همزمان ۱۵ رمزارز برتر بازار با ۳ تایم فریم و ۱۰ اندیکاتور تکنیکال</p>
            <p class="subtitle">⚡ داده‌های لحظه‌ای از CoinGecko | <a href="/simulator" class="simulator-link">🎮 شبیه‌ساز معاملاتی</a></p>
        </div>
        <div class="nav-bar">
            <a href="/" class="nav-btn active">📊 تحلیل</a>
            <a href="/simulator" class="nav-btn">🎮 شبیه‌ساز</a>
        </div>
        <div class="controls">
            <button class="btn btn-primary" id="refreshBtn" onclick="getAnalysis()"><i class="fas fa-sync-alt"></i> دریافت تحلیل جدید</button>
            <div class="filters">
                <input type="text" id="searchInput" placeholder="🔍 جستجوی رمزارز..." oninput="applyFilters()">
                <select id="signalFilter" onchange="applyFilters()"><option value="all">همه سیگنال‌ها</option><option value="BUY">خرید</option><option value="SELL">فروش</option><option value="NEUTRAL">نگهداری</option></select>
                <select id="sortFilter" onchange="applyFilters()"><option value="default">مرتب‌سازی پیش‌فرض</option><option value="change-high">بیشترین رشد</option><option value="change-low">بیشترین افت</option><option value="price-high">بیشترین قیمت</option><option value="price-low">کمترین قیمت</option></select>
            </div>
        </div>
        <div id="results"><div class="loading"><span class="spinner"><i class="fas fa-spinner"></i></span>در حال دریافت داده‌ها و تحلیل رمزارزها...</div></div>
        <div class="footer">⚡ داده‌ها از CoinGecko | تحلیل‌ها فقط جنبه اطلاع‌رسانی دارند</div>
    </div>
    <script>
        let allData={},chartInstances={},chartVisible={};
        async function getAnalysis(){const e=document.getElementById('results'),t=document.getElementById('refreshBtn');t.disabled=!0,t.innerHTML='<i class="fas fa-spinner fa-spin"></i> در حال تحلیل...';e.innerHTML='<div class="loading"><span class="spinner"><i class="fas fa-spinner"></i></span>در حال دریافت داده‌ها و تحلیل رمزارزها...</div>';try{const r=await fetch('/api/analyze');if(!r.ok)throw new Error('خطا در ارتباط با سرور');const a=await r.json();if(a.error)throw new Error(a.error);if(!a||0===Object.keys(a).length)throw new Error('هیچ داده‌ای دریافت نشد');allData=a;for(const[r,o]of Object.entries(a)){const n=o.id||'bitcoin';try{const e=await fetch(`/api/history/${n}?days=7`);if(e.ok){const r=await e.json();o.history=r}}catch(e){console.log(`خطا در دریافت تاریخچه ${r}:`,e)}}renderData(a)}catch(r){e.innerHTML=`<div style="background:rgba(225,112,85,0.2);border:1px solid #e17055;border-radius:15px;padding:30px;text-align:center;color:#e17055;"><i class="fas fa-exclamation-triangle" style="font-size:2em;display:block;margin-bottom:15px;"></i>❌ خطا: ${r.message}</div>`}finally{t.disabled=!1,t.innerHTML='<i class="fas fa-sync-alt"></i> دریافت تحلیل جدید'}}
        function renderData(e){const t=document.getElementById('results');let r='',a=0;const n={hourly:'⏰ ۱ ساعته',daily:'📅 روزانه',weekly:'📆 هفتگی'},l={hourly:'#667eea',daily:'#f7971e',weekly:'#e17055'};let o=Object.entries(e);const d=document.getElementById('signalFilter').value;'all'!==d&&(o=o.filter((([e,t])=>{const r=t.timeframes?.daily||t.timeframes?.hourly||{};return r.signal===d})));const s=document.getElementById('searchInput').value.toLowerCase();s&&(o=o.filter((([e,t])=>e.includes(s))));const c=document.getElementById('sortFilter').value;'change-high'===c?o.sort(((e,t)=>t[1].change-e[1].change)):'change-low'===c?o.sort(((e,t)=>e[1].change-t[1].change)):'price-high'===c?o.sort(((e,t)=>{const r=e[1].timeframes?.daily?.price||e[1].timeframes?.hourly?.price||0,a=t[1].timeframes?.daily?.price||t[1].timeframes?.hourly?.price||0;return a-r})):'price-low'===c&&o.sort(((e,t)=>{const r=e[1].timeframes?.daily?.price||e[1].timeframes?.hourly?.price||0,a=t[1].timeframes?.daily?.price||t[1].timeframes?.hourly?.price||0;return r-a}));for(const[e,d]of o){const o=d.timeframes||{},s=o.daily||{},c=s.signal||'NEUTRAL',i='BUY'===c?'🟢 خرید':'SELL'===c?'🔴 فروش':'🟡 نگهداری',u='BUY'===c?'badge-buy':'SELL'===c?'badge-sell':'badge-hold',m=d.change||0,g=m>=0?'positive':'negative';a++;const p=`chart-${a}`;chartVisible[p]=!1,r+=`<div class="asset-section" data-name="${e}" data-signal="${c}"><div class="asset-title" onclick="toggleChart('${p}')"><span>💰 ${e}</span><span class="change ${g}">تغییر ۲۴h: ${m>=0?'▲':'▼'} ${Math.abs(m).toFixed(2)}% <span class="badge ${u}" style="margin-right:10px;">${i}</span></span></div><div class="timeframes-grid">`;for(const[e,t]of Object.entries(o)){const a=t.indicators||{},d=t.signal||'NEUTRAL',s='BUY'===d?'🟢 خرید':'SELL'===d?'🔴 فروش':'🟡 نگهداری',c='BUY'===d?'badge-buy':'SELL'===d?'badge-sell':'badge-hold',h=t.score||0;r+=`<div class="timeframe-card" style="border-top:3px solid ${l[e]||'#667eea'}"><div class="timeframe-header"><span class="timeframe-label">${n[e]||e}</span><span><span class="badge ${c}">${s}</span><span class="badge-score">${h>0?'+':''}${h}</span></span></div><div class="timeframe-price">$${Number(t.price).toLocaleString()}</div><div class="suggestion-text">💡 ${t.reason||'در حال تحلیل...'}</div><div class="levels-grid"><div class="level-item"><div class="label">📉 S2</div><div class="value">$${Number(a.s2||0).toLocaleString()}</div></div><div class="level-item"><div class="label">📉 S1</div><div class="value">$${Number(a.s1||0).toLocaleString()}</div></div><div class="level-item"><div class="label">📊 پیوت</div><div class="value">$${Number(a.pivot||0).toLocaleString()}</div></div><div class="level-item"><div class="label">📈 R1</div><div class="value">$${Number(a.r1||0).toLocaleString()}</div></div></div><div class="indicators-grid"><div class="indicator-item"><div class="label">RSI</div><div class="value ${a.rsi>70?'value-sell':a.rsi<30?'value-buy':'value-neutral'}">${a.rsi||'-'}</div></div><div class="indicator-item"><div class="label">Stoch RSI</div><div class="value ${a.stoch_rsi>80?'value-sell':a.stoch_rsi<20?'value-buy':'value-neutral'}">${a.stoch_rsi||'-'}</div></div><div class="indicator-item"><div class="label">MACD</div><div class="value ${a.macd>0?'value-buy':'value-sell'}">${a.macd?Number(a.macd).toFixed(4):'-'}</div></div><div class="indicator-item"><div class="label">ADX</div><div class="value ${a.adx>40?'value-buy':'value-neutral'}">${a.adx||'-'}</div></div><div class="indicator-item"><div class="label">SMA ۲۰</div><div class="value">$${Number(a.sma_20||0).toLocaleString()}</div></div><div class="indicator-item"><div class="label">SMA ۵۰</div><div class="value">$${Number(a.sma_50||0).toLocaleString()}</div></div><div class="indicator-item"><div class="label">باند بالا</div><div class="value" style="color:#e17055;">$${Number(a.bb_high||0).toLocaleString()}</div></div><div class="indicator-item"><div class="label">باند پایین</div><div class="value" style="color:#00b894;">$${Number(a.bb_low||0).toLocaleString()}</div></div></div><div style="margin-top:8px;font-size:.65em;color:rgba(255,255,255,0.3);">فیبوناچی: ۲۳.۶%: $${Number(a.fib_236||0).toLocaleString()} | ۶۱.۸%: $${Number(a.fib_618||0).toLocaleString()}</div></div>`}r+=`</div><div class="chart-container" id="${p}" style="display:none;"><canvas id="canvas-${p}"></canvas><div style="text-align:center;font-size:.7em;color:rgba(255,255,255,0.3);margin-top:5px;"><span class="chart-toggle" onclick="toggleChart('${p}')">🔽 بستن چارت</span></div></div></div>`}0===a?r='<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.4);">هیچ رمزارزی با این فیلتر پیدا نشد</div>':r=`<div style="text-align:center;color:rgba(255,255,255,0.3);margin-bottom:15px;font-size:.9em;">${a} رمزارز</div>`+r,t.innerHTML=r,setTimeout((()=>{for(const[t,r]of Object.entries(e)){const a=Object.keys(e).indexOf(t)+1,n=`chart-${a}`;r.history&&r.history.length>0&&createChart(n,r.history,t)}}),300)}
        function createChart(e,t,r){const a=document.getElementById(`canvas-${e}`);if(!a)return;const n=a.getContext('2d');chartInstances[e]&&chartInstances[e].destroy();const l=t.map((e=>new Date(e.time).toLocaleDateString('fa-IR'))),o=t.map((e=>e.price));chartInstances[e]=new Chart(n,{type:'line',data:{labels:l,datasets:[{label:r,data:o,borderColor:'#f7971e',backgroundColor:'rgba(247,151,30,0.1)',fill:!0,tension:.4,pointRadius:0,borderWidth:2}]},options:{responsive:!0,maintainAspectRatio:!0,plugins:{legend:{display:!1}},scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'rgba(255,255,255,0.3)',font:{size:8}}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'rgba(255,255,255,0.3)',font:{size:8}}}}}})}
        function toggleChart(e){const t=document.getElementById(e);if(!t)return;'none'===t.style.display?(t.style.display='block',setTimeout((()=>{chartInstances[e]&&chartInstances[e].resize()}),100)):t.style.display='none'}
        function applyFilters(){Object.keys(allData).length>0&&renderData(allData)}
        window.onload=getAnalysis;
    </script>
</body>
</html>
